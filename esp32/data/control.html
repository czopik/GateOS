<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>GateOS - Sterowanie</title>
  <link rel="stylesheet" href="/styles.css?v=20260515a">
  <style>
    :root{
      --safe-top:env(safe-area-inset-top, 0px);
      --safe-bottom:env(safe-area-inset-bottom, 0px);
    }

    body.control-mobile{
      min-height:100vh;
      min-height:100dvh;
      overflow-x:hidden;
    }

    .control-topbar .topbar-inner{
      max-width:1160px;
    }

    .control-app-shell{
      width:min(100%, 920px);
      margin:0 auto;
      padding:18px 16px calc(28px + var(--safe-bottom));
      display:grid;
      gap:14px;
      align-content:start;
    }

    .control-card{
      background:rgba(11,18,30,0.82);
      border:1px solid rgba(255,255,255,0.12);
      border-radius:26px;
      box-shadow:0 24px 60px rgba(0,0,0,0.32);
      backdrop-filter:blur(16px);
    }

    .camera-card{
      padding:10px;
      min-height:220px;
    }

    .camera-frame{
      position:relative;
      width:100%;
      height:min(42dvh, 420px);
      min-height:200px;
      border-radius:22px;
      overflow:hidden;
      background:
        radial-gradient(circle at 15% 20%, rgba(61,217,182,0.18), transparent 38%),
        linear-gradient(180deg, rgba(10,18,30,0.95), rgba(5,10,18,0.98));
      border:1px solid rgba(255,255,255,0.08);
    }

    .camera-frame img,
    .camera-frame iframe{
      width:100%;
      height:100%;
      border:0;
      display:none;
      object-fit:cover;
      background:rgba(8,14,24,0.92);
    }

    .camera-frame.has-image img{display:block}
    .camera-frame.has-embed iframe{display:block}
    .camera-frame.has-image .camera-empty,
    .camera-frame.has-embed .camera-empty{display:none}

    .camera-empty{
      position:absolute;
      inset:0;
      display:grid;
      place-content:center;
      gap:10px;
      padding:18px;
      text-align:center;
      color:var(--muted);
      background:linear-gradient(180deg, rgba(8,14,24,0.7), rgba(8,14,24,0.88));
    }

    .camera-empty strong{
      color:var(--text);
      font-size:18px;
    }

    .status-card{
      padding:14px 16px;
    }

    .gate-progress-shell{
      display:grid;
      grid-template-columns:18px minmax(0, 1fr) 18px;
      gap:10px;
      align-items:center;
    }

    .gate-progress-track{
      min-width:0;
    }

    .progress-arc{
      width:100%;
      height:14px;
      border-radius:999px;
      background:rgba(255,255,255,0.08);
      overflow:hidden;
    }

    .progress-arc-fill{
      height:100%;
      width:0%;
      background:linear-gradient(90deg, var(--accent), var(--success));
      transition:width 260ms ease;
      border-radius:999px;
    }

    .limit-indicator{
      width:18px;
      height:18px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,0.14);
      background:rgba(255,255,255,0.08);
      box-shadow:inset 0 0 0 1px rgba(255,255,255,0.04);
      transition:background 180ms ease, border-color 180ms ease, box-shadow 180ms ease, transform 180ms ease;
    }

    .limit-indicator.is-active{
      background:var(--success);
      border-color:rgba(99,230,165,0.95);
      box-shadow:0 0 0 7px rgba(99,230,165,0.14);
      transform:scale(1.02);
    }

    .action-card{
      padding:16px;
      display:grid;
      gap:10px;
    }

    .hold-hint{
      margin:0;
      font-size:12px;
      font-weight:700;
      letter-spacing:0.08em;
      text-transform:uppercase;
      color:var(--muted);
    }

    .hold-button{
      width:100%;
      min-height:102px;
      border-radius:30px;
      border:1px solid rgba(255,255,255,0.1);
      background:
        radial-gradient(circle at 14% 22%, rgba(61,217,182,0.18), transparent 34%),
        linear-gradient(180deg, rgba(12,24,38,0.96), rgba(6,14,24,0.99));
      box-shadow:0 24px 60px rgba(0,0,0,0.34);
      color:var(--text);
      display:flex;
      align-items:center;
      gap:16px;
      padding:16px 18px;
      cursor:pointer;
      text-align:left;
      transition:transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease, opacity 160ms ease;
      -webkit-tap-highlight-color:transparent;
      touch-action:none;
    }

    .hold-button:hover{
      transform:translateY(-1px);
    }

    .hold-button:disabled{
      opacity:0.45;
      cursor:not-allowed;
      box-shadow:none;
      transform:none;
    }

    .hold-button.is-holding{
      border-color:rgba(99,230,165,0.96);
      box-shadow:0 0 0 12px rgba(61,217,182,0.1), 0 24px 70px rgba(61,217,182,0.18);
      transform:scale(0.99);
    }

    .hold-button.hold-fired{
      border-color:rgba(99,230,165,1);
      box-shadow:0 0 0 14px rgba(61,217,182,0.12), 0 24px 70px rgba(61,217,182,0.22);
    }

    .hold-button.is-sending{
      border-color:rgba(90,169,255,0.96);
      box-shadow:0 0 0 12px rgba(90,169,255,0.14), 0 24px 70px rgba(90,169,255,0.18);
    }

    .hold-button.moving{
      border-color:rgba(244,195,92,0.92);
    }

    .hold-button.error{
      border-color:rgba(255,107,107,0.92);
      box-shadow:0 0 0 10px rgba(255,107,107,0.08), 0 24px 60px rgba(0,0,0,0.3);
    }

    .hold-button-track{
      --track-width:112px;
      --track-height:58px;
      --thumb-size:46px;
      flex:0 0 auto;
      width:var(--track-width);
      height:var(--track-height);
      padding:6px;
      border-radius:999px;
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.08);
    }

    .hold-button-thumb{
      width:var(--thumb-size);
      height:var(--thumb-size);
      border-radius:50%;
      display:grid;
      place-items:center;
      color:#06211a;
      background:linear-gradient(135deg, var(--accent), var(--success));
      box-shadow:0 12px 24px rgba(0,0,0,0.22);
      transform:translateX(0);
      transition:transform 220ms ease, background 180ms ease, color 180ms ease;
    }

    .hold-button.is-on .hold-button-thumb,
    .hold-button.moving .hold-button-thumb{
      transform:translateX(calc(var(--track-width) - var(--thumb-size) - 12px));
    }

    .hold-button.moving .hold-button-thumb{
      background:linear-gradient(135deg, #f6d365, #f4c35c);
      color:#2a1b04;
    }

    .hold-button.error .hold-button-thumb{
      background:linear-gradient(135deg, #ff8a8a, #ff6b6b);
      color:#2b0f0f;
    }

    .hold-button.is-sending .hold-button-thumb{
      background:linear-gradient(135deg, #78b4ff, #5aa9ff);
      color:#081a2c;
    }

    .hold-button-copy{
      min-width:0;
      flex:1;
      display:grid;
      gap:5px;
    }

    .hold-icon{
      width:28px;
      height:28px;
    }

    .hold-title{
      font-size:clamp(24px, 4vw, 36px);
      font-weight:800;
      line-height:1;
      text-transform:uppercase;
      letter-spacing:0.02em;
    }

    .hold-subtitle{
      font-size:13px;
      line-height:1.35;
      color:var(--muted);
      max-width:320px;
    }

    .toast{
      right:14px;
      bottom:calc(14px + var(--safe-bottom));
      max-width:min(360px, calc(100vw - 28px));
    }

    .mobile-tabbar{
      display:none;
    }

    @media (max-width:900px){
      .control-topbar{display:none}

      body.control-mobile{
        overflow:hidden;
      }

      .control-app-shell{
        width:100%;
        min-height:100dvh;
        height:100dvh;
        padding:calc(12px + var(--safe-top)) 12px calc(92px + var(--safe-bottom));
        overflow:hidden;
      }

      .camera-card{
        min-height:0;
      }

      .camera-frame{
        height:clamp(180px, 34dvh, 272px);
        min-height:180px;
      }

      .status-card{
        padding:12px 14px;
      }

      .hold-button{
        min-height:92px;
        padding:14px 16px;
        gap:14px;
      }

      .hold-button-track{
        --track-width:104px;
        --track-height:56px;
        --thumb-size:44px;
      }

      .mobile-tabbar{
        position:fixed;
        left:12px;
        right:12px;
        bottom:calc(12px + var(--safe-bottom));
        display:grid;
        grid-template-columns:repeat(3, 1fr);
        gap:8px;
        padding:8px;
        border-radius:26px;
        background:rgba(8,12,20,0.92);
        border:1px solid rgba(255,255,255,0.1);
        box-shadow:0 20px 44px rgba(0,0,0,0.34);
        backdrop-filter:blur(18px);
        z-index:55;
      }

      .mobile-tab{
        min-height:62px;
        padding:10px 8px;
        border-radius:18px;
        display:grid;
        justify-items:center;
        gap:6px;
        color:var(--muted);
        font-size:12px;
        font-weight:700;
        letter-spacing:0.02em;
      }

      .mobile-tab svg{
        width:22px;
        height:22px;
      }

      .mobile-tab.active{
        color:var(--success);
        background:linear-gradient(180deg, rgba(61,217,182,0.18), rgba(61,217,182,0.08));
        border:1px solid rgba(61,217,182,0.18);
      }

      .mobile-tab:not(.active):active{
        background:rgba(255,255,255,0.05);
      }
    }

    @media (max-width:520px){
      .camera-frame{
        height:clamp(168px, 31dvh, 224px);
      }

      .hold-title{
        font-size:20px;
      }

      .hold-subtitle{
        font-size:12px;
      }
    }
  </style>
</head>
<body class="control-mobile">
  <header class="topbar control-topbar">
    <div class="topbar-inner">
      <div class="brand" aria-label="GateOS">
        <div class="logo">G</div>
        <div>GateOS</div>
      </div>
      <nav class="nav" aria-label="Nawigacja">
        <a href="/">Dashboard</a>
        <a class="active" href="/control.html">Sterowanie</a>
        <a href="/remotes.html">Piloty</a>
        <a href="/settings.html">Ustawienia</a>
      </nav>
    </div>
  </header>

  <main class="control-app-shell">
    <section class="control-card camera-card" id="cameraCard">
      <div class="camera-frame" id="cameraFrame">
        <img id="cameraImage" alt="Podglad kamery" loading="lazy" referrerpolicy="no-referrer">
        <iframe id="cameraEmbed" title="Podglad kamery" loading="lazy" referrerpolicy="no-referrer" allow="fullscreen"></iframe>
        <div class="camera-empty" id="cameraEmpty">
          <strong id="cameraEmptyTitle">Brak obrazu kamery</strong>
          <p id="cameraEmptyText">Ustaw lokalny URL snapshotu w Ustawieniach.</p>
        </div>
      </div>
    </section>

    <section class="control-card status-card">
      <div class="sr-only">
        <div class="state-label" id="stateLabel">--</div>
        <span class="status-pill ok" id="safetyBadge">OK</span>
        <span class="status-pill neutral" id="controlBadge">Sterowanie: dozwolone</span>
        <span id="posPct">--</span>
        <span id="liveValue">--</span>
      </div>

      <div class="gate-progress-shell" aria-label="Pozycja bramy i stan krancowek">
        <span class="limit-indicator" id="limitCloseValue" aria-label="Krancowka zamkniecia nieaktywna"></span>
        <div class="gate-progress-track">
          <div class="progress-arc" aria-label="Otwarcie bramy">
            <div class="progress-arc-fill" id="progressFill"></div>
          </div>
        </div>
        <span class="limit-indicator" id="limitOpenValue" aria-label="Krancowka otwarcia nieaktywna"></span>
      </div>
    </section>

    <section class="control-card action-card">
      <p class="hold-hint" id="holdHint">Przytrzymaj 1 s, aby aktywowac</p>

      <button class="hold-button" id="toggleBtn" aria-label="Otworz lub zamknij brame">
        <span class="hold-button-track" aria-hidden="true">
          <span class="hold-button-thumb">
            <svg class="hold-icon" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M14 46V20l10-8h16l10 8v26"/>
              <path d="M24 46V22"/>
              <path d="M32 46V22"/>
              <path d="M40 46V22"/>
              <path d="M48 46V22"/>
              <path d="M14 30h36"/>
            </svg>
          </span>
        </span>
        <span class="hold-button-copy">
          <span class="hold-title" id="toggleTitle">Otworz</span>
          <span class="hold-subtitle" id="holdStateText">Przytrzymaj 1 s, aby wyslac sygnal</span>
        </span>
      </button>
    </section>
  </main>

  <nav class="mobile-tabbar" aria-label="Szybka nawigacja">
    <a class="mobile-tab" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 10.5 12 3l9 7.5"/>
        <path d="M5 9.5V21h14V9.5"/>
        <path d="M9.5 21v-6h5v6"/>
      </svg>
      <span>Dashboard</span>
    </a>
    <a class="mobile-tab" href="/remotes.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="5" y="3" width="14" height="18" rx="4"/>
        <path d="M9 8h6"/>
        <path d="M9 12h6"/>
        <path d="M9 16h6"/>
      </svg>
      <span>Piloty</span>
    </a>
    <a class="mobile-tab" href="/settings.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3.2"/>
        <path d="M19.4 15a1 1 0 0 0 .2 1.1l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1 1 0 0 0-1.1-.2 1 1 0 0 0-.6.9V20a2 2 0 1 1-4 0v-.2a1 1 0 0 0-.6-.9 1 1 0 0 0-1.1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1 1 0 0 0 .2-1.1 1 1 0 0 0-.9-.6H4a2 2 0 1 1 0-4h.2a1 1 0 0 0 .9-.6 1 1 0 0 0-.2-1.1l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1 1 0 0 0 1.1.2 1 1 0 0 0 .6-.9V4a2 2 0 1 1 4 0v.2a1 1 0 0 0 .6.9 1 1 0 0 0 1.1-.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1 1 0 0 0-.2 1.1 1 1 0 0 0 .9.6h.2a2 2 0 1 1 0 4h-.2a1 1 0 0 0-.9.6Z"/>
      </svg>
      <span>Ustawienia</span>
    </a>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/webui-core.js?v=20260515b"></script>
  <script src="/control.js?v=20260516e"></script>
</body>
</html>
